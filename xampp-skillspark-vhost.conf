# Add this complete block to:
# C:/xampp/apache/conf/extra/httpd-vhosts.conf
# It is separate from the existing EdixPark virtual hosts.
<VirtualHost *:80>
    ServerName skillspark.local
    DocumentRoot "C:/xampp/htdocs/SkillsPark/public"

    <Directory "C:/xampp/htdocs/SkillsPark/public">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    ErrorLog "logs/skillspark.local-error.log"
    CustomLog "logs/skillspark.local-access.log" common
</VirtualHost>
