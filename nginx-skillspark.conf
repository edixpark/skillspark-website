# SkillsPark-only server block. Confirm the PHP-FPM socket with: ls /run/php/
server {
    listen 80;
    listen [::]:80;
    server_name skillspark.edixpark.com;
    root /var/www/skillspark/public;
    index index.php;

    access_log /var/log/nginx/skillspark.access.log;
    error_log /var/log/nginx/skillspark.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include snippets/fastcgi-php.conf;
        # Replace 8.2 only if the inspected SkillsPark PHP-FPM socket differs.
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~* \.(?:css|js|svg|png|jpe?g|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
        access_log off;
    }

    location ~ /\. { deny all; }
    location ~* ^/(?:app|config|storage|scripts|tests|vendor)/ { deny all; }
    location ~* \.(?:env|ini|log|lock|json|md|sh)$ { deny all; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;

    error_page 404 /index.php;
    client_max_body_size 2m;
}
