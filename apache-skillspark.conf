<VirtualHost *:80>
    ServerName skillspark.edixpark.com
    DocumentRoot /var/www/skillspark/public

    <Directory /var/www/skillspark/public>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    <Directory /var/www/skillspark>
        Require all denied
    </Directory>
    <Directory /var/www/skillspark/public>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/skillspark-error.log
    CustomLog ${APACHE_LOG_DIR}/skillspark-access.log combined

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</VirtualHost>
